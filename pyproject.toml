[project]
name = "ph-law-rag"
version = "0.1.0"
description = "A RAG Project using PH Law"
requires-python = ">=3.11"
dependencies = [
 "beautifulsoup4>=4.14.3",
 "datasets>=5.0.0",
 "fastapi>=0.136.0",
 "httpx>=0.28.1",
 "langchain>=0.3,<1",
 "langchain-anthropic>=0.3.22",
 "langchain-community>=0.3,<0.4",
 "langchain-core>=0.3,<1",
 "langchain-ollama>=0.2,<1",
 "langchain-openai>=0.2,<1",
 "llama-index-core>=0.14.21",
 "llama-index-embeddings-ollama>=0.9.0",
 "llama-index-retrievers-bm25>=0.7.1",
 "llama-index-vector-stores-qdrant>=0.10.0",
 "pdfplumber>=0.11.9",
 "pydantic>=2.13.3",
 "pydantic-settings>=2.14.0",
 "pyyaml>=6.0.3",
 "qdrant-client>=1.17.1",
 "ragas>=0.4.3",
 "sentence-transformers>=5.5.1",
 "torch>=2.10.0",
 "streamlit>=1.56.0",
 "trafilatura>=2.0.0",
 "typer>=0.24.2",
 "typing>=3.10.0.0",
 "uvicorn>=0.46.0",
 "anthropic>=0.107.1",
 "llama-index-embeddings-bedrock>=0.8.0",
 "boto3>=1.40.61",
 "truststore>=0.10.4",
 "structlog>=26.1.0",
]

[project.scripts]
raglab = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
]

[tool.pytest.ini_options]
markers = [
    "unit:pure logic, no services",
    "integration: needs Qdrant/Ollama running"
]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
