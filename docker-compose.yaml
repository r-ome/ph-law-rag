services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ph-law-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped

  api:
    build: .
    image: ph-law-rag:latest
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      qdrant_url: http://qdrant:6333
      ollama_base_url: http://host.docker.internal:11434
      # Serving pins MiniLM; bedrock (the config default) is quota-capped at
      # 2 calls/min, qwen3 needs a GPU. See ADR-021 / ADR-016.
      reranker_backend: minilm
    volumes:
      - ./data:/app/data

  ui:
    image: ph-law-rag:latest
    depends_on:
      - api
    command: streamlit run app/ui/home.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      api_base_url: http://api:8000
