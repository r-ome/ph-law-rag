services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ph-law-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped

  api:
    build: .
    image: ph-law-rag:latest
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      qdrant_url: http://qdrant:6333
      ollama_base_url: http://host.docker.internal:11434
      # Serving pins MiniLM; bedrock (the config default) is quota-capped at
      # 2 calls/min, qwen3 needs a GPU. See ADR-021 / ADR-016.
      reranker_backend: minilm
    volumes:
      - ./data:/app/data

  web:
    build: ./frontend
    image: ph-law-rag-web:latest
    depends_on:
      - api
    # nginx serves the built SPA and reverse-proxies /api -> api:8000
    # (see frontend/nginx.conf). Browse to http://localhost:8080.
    # For frontend iteration, run `npm run dev` on the host instead (Vite :5173).
    ports:
      - "8080:80"
