server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routes fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy — mirrors the Vite dev proxy: /api/foo -> http://api:8000/foo.
    # Upstream "api" is the compose service name and the ECS Service Connect
    # dns_name (both resolve to the FastAPI container). The trailing slash on
    # proxy_pass strips the /api prefix, matching the client's expectations.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Answers (and eval-lab runs) can take 30s+; don't cut them at nginx's
        # 60s default. Matches the old Streamlit api_request_timeout=600.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Health probe for the ALB target group / compose healthcheck.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
