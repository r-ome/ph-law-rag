# Dev-only overrides — auto-merged by `docker compose up` (no -f flag needed).
# Mounts host source over the baked image copies and turns on hot reload, so
# code edits take effect without a rebuild. Rebuild only when deps change
# (pyproject.toml / uv.lock). For the frozen prod image, bypass this file with:
#   docker compose -f docker-compose.yaml up
#
# NOTE: we mount only ./app and ./sources — never `.:/app`, which would shadow
# the image's /app/.venv (the installed deps). ./data is mounted by the base file.
services:
  api:
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    volumes:
      - ./app:/app/app
      - ./sources:/app/sources
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface

  # No dev override for `web`: the nginx image serves a static build with no
  # hot reload. Iterate on the frontend with `npm run dev` on the host (Vite
  # :5173 proxies /api -> localhost:8000); rebuild `web` only to mirror prod.
