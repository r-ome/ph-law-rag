name: ph-law-rag-cloud
## Local smoke of the cloud image. Talks to Qdrant Cloud + Bedrock + Anthropic.
## Run: docker compose -f docker-compose.cloud.yaml up --build
services:
  api:
    platform: linux/arm64
    build:
      context: .
      dockerfile: dockerfile
      args:
        REQUIRE_SEED: "true"       # cloud image must bake the seed artifacts
        PRELOAD_RERANKER: "true"   # bake MiniLM so Fargate never downloads at startup
    image: ph-law-rag:cloud
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file: [.env.cloud-gate]
    environment:
      AWS_PROFILE: ph-law-rag-dev
      # Match the deployed demo (infra API_ENVIRONMENT): serving uses MiniLM;
      # bedrock (eval/host default) is quota-capped 2 calls/min. See ADR-021.
      reranker_backend: minilm
      trace_logging_enabled: "true"
      router_enabled: "true"
      router_model: claude-haiku-4-5
    volumes:
      - ${HOME}/.aws:/root/.aws:ro

  ui:
    platform: linux/arm64
    image: ph-law-rag:cloud
    depends_on: [api]
    command: streamlit run app/ui/home.py --server.address 0.0.0.0 --server.port 8501
    ports: ["8501:8501"]
    environment:
      api_base_url: http://api:8000
      llm_model: claude-haiku-4-5
