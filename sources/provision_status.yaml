# Provision-level operability overrides — whole-provision repeal/reclassification only.
#
# Each entry marks a single base provision as no longer current law, so retrieval suppresses
# it (operability_action: hide) even though its parent document is operative. Keyed on the
# canonical provision_id emitted by the chunker (source_id:unit_type:unit_number, lowercased).
#
# SCOPE: whole-provision death via bare entries, OR partial amendments via unit_labels + source_id
# (exact label match, never prefix), only when the replacement text is indexed and operative
# (basis_source_id). Whole-provision entries remain forbidden for partials. Leaf-scoped entries also
# stamp parent_has_hidden_leaves on surviving siblings.
# HARD RULE: same-id collisions (an amendment inserts a replacement carrying the same
# provision_id as a base provision) must never become BARE overrides - bare entries match
# provision_id across source_id values and would hide the inserted replacement too.
# A source_id-scoped entry is safe (apply_overrides skips non-matching source_id). For
# collisions, use a source_id-scoped hide when the base provision is wholly dead. Add a
# provision_supersession.yaml pair only when stale text remains retrievable.
# status of the document is NEVER changed here; only provision_status + operability_action.
# Applied at INDEX time — edits require `raglab reindex` (sync will not detect override drift).

